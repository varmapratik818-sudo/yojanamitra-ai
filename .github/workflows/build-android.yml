
name: Build YojanaMitra AI Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare website files
        run: |
          mkdir -p www
          cp index.html www/
          if [ -f maharashtra-guide.html ]; then
            cp maharashtra-guide.html www/
          fi
          if [ -f vacancies.json ]; then
            cp vacancies.json www/
          fi

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Configure Android app
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.yojanamitraai.app",
            "appName": "YojanaMitra AI",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yojanamitra-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
